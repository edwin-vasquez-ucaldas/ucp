input {
  file {
    path => "/var/log/apps/orders-api/*.log"
    start_position => "beginning"
    tags => ["orders-api"]
    codec => json
  }
  
  file {
    path => "/var/log/apps/orders-processor/*.log"
    start_position => "beginning"
    tags => ["orders-processor"]
    codec => json
  }
}

filter {
  if "orders-api" in [tags] {
    mutate {
      add_field => { "service" => "orders-api" }
      add_field => { "environment" => "development" }
    }
  }
  
  if "orders-processor" in [tags] {
    mutate {
      add_field => { "service" => "orders-processor" }
      add_field => { "environment" => "development" }
    }
  }

  # Parse structured logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Extract correlation ID if present
  if [parsed][CorrelationId] {
    mutate {
      add_field => { "correlation_id" => "%{[parsed][CorrelationId]}" }
    }
  }

  # Parse timestamp
  date {
    match => [ "[@timestamp]", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "orders-logs-%{+YYYY.MM.dd}"
  }
  
  stdout { 
    codec => rubydebug 
  }
}