global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "orders-api"
    static_configs:
      - targets: ["orders-api:8080"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "orders-processor"
    static_configs:
      - targets: ["orders-processor:8081"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
    metrics_path: "/metrics"
    scrape_interval: 30s
